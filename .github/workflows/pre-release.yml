name: Pre-Release (Release Branch)

on:
  workflow_run:
    workflows:
      - "CI/CD Pipeline"
    types:
      - completed
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs: {}

permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: write
  checks: write
  issues: write

jobs:
  pre-release:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/prerelease-reusable.yml
    with:
      target_branch: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      validate_release_branch: true
      publish_to_npm: false
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify-success:
    runs-on: ubuntu-latest
    needs: [pre-release]
    if: success()

    steps:
      - name: Success Notification
        run: |
          echo "🧪 Release-branch prerelease ${{ needs.pre-release.outputs.tag }} created successfully!"
          echo "📦 Tested npm tarball (*.tgz) attached to the GitHub prerelease"
          echo "📝 Generated from ${{ github.event.workflow_run.head_branch || github.ref_name }}"
          echo ""
          echo "🔗 Pre-release URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.pre-release.outputs.tag }}"
